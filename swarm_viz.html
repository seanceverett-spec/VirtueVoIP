<script>

const obs = [5.0, 2.5, 1.4];
const dSafe = 1.0;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const N = 40, dt = 0.1;
let step = 0;

function toPx(x, y) {
  return [35 + (x / 11.0) * 410, 280 - (y / 5.5) * 240];
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  
  // Obstacle
  let [ox, oy] = toPx(obs[0], obs[1]);
  let rPx = (obs[2] / 11.0) * 410;
  ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
  ctx.strokeStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(ox, oy, rPx, 0, 2*Math.PI); ctx.fill(); ctx.stroke();

  // Paths
  const colors = ['#38bdf8', '#4ade80'];
  for(let m=0; m<2; m++) {
    let pts = data['agent_' + m];
    ctx.strokeStyle = colors[m];
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let k=0; k<=N; k++) {
      let [x, y] = toPx(pts[k][0], pts[k][1]);
      if(k===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Active vehicle
    let [cx, cy] = toPx(pts[step][0], pts[step][1]);
    ctx.fillStyle = colors[m];
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 2*Math.PI); ctx.fill();

    // Buffer zone
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(cx, cy, (dSafe/2 / 11.0)*410, 0, 2*Math.PI); ctx.stroke();
  }

  document.getElementById('t').innerText = (step * dt).toFixed(2);
  document.getElementById('s').innerText = step;
  step = (step + 1) % (N + 1);
}
setInterval(draw, 90);
</script>
